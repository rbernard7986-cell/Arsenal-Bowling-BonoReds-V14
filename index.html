<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Arsenal Bowling by BonoRed's</title><style>
:root{--bg:#07111f;--p:#10243a;--p2:#152e49;--line:#2c4967;--ink:#f5f8fc;--muted:#9db0c7;--gold:#ffc857;--green:#42d392;--red:#ff6b6b;--blue:#52a8ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,var(--bg),#10253d);color:var(--ink);font:15px system-ui;min-height:100vh}button,input,select,textarea{font:inherit}.app{max-width:1350px;margin:auto;padding:12px 12px 95px}.top{display:flex;justify-content:space-between}.brand{font-size:28px;font-weight:900;color:var(--gold)}.brand span{display:block;color:var(--muted);font-size:13px}.version{display:inline-block;color:var(--green);font-size:11px;border:1px solid var(--line);padding:3px 8px;border-radius:99px;margin-top:5px}.status{color:var(--muted);font-size:12px}.tabs{display:flex;gap:6px;overflow:auto;position:sticky;top:0;z-index:20;background:#07111fee;padding:8px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#142a43;color:white;border-radius:99px;padding:9px 12px}.tab.active{background:var(--gold);color:#111}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.card{grid-column:span 12;background:linear-gradient(145deg,var(--p),var(--p2));border:1px solid var(--line);border-radius:15px;padding:15px}.half{grid-column:span 6}h2,h3{color:var(--gold);margin:0 0 12px}.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}input,select,textarea{width:100%;background:#071522;color:white;border:1px solid #36516e;border-radius:10px;padding:10px;min-height:44px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:var(--blue);color:#07111f;cursor:pointer}.gold{background:var(--gold)}.green{background:var(--green)}.red{background:var(--red)}.ghost{background:#213952;color:white}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.balls,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.ball,.mini{background:#091827;border:1px solid var(--line);border-radius:13px;padding:13px}.tag{display:inline-block;background:#203b57;border-radius:99px;padding:4px 8px;margin:2px;font-size:12px}.muted{color:var(--muted)}.choices{display:flex;overflow:auto;gap:9px;padding:14px calc(50% - 105px) 20px;scroll-snap-type:x mandatory}.choice{flex:0 0 190px;scroll-snap-align:center;background:#091827;border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}.choice.best{border:3px solid var(--gold);flex-basis:220px}.score{font-size:28px;color:var(--green);font-weight:900}.rule{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rule div{background:#142c46;border:1px solid var(--line);padding:11px;border-radius:11px;text-align:center}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:#091827;border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:24px;color:var(--green)}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.feedback{display:none;margin-top:8px;padding:10px;border-radius:10px}.feedback.ok,.feedback.err{display:block}.feedback.ok{background:#0d3325}.feedback.err{background:#431b22}.savezone{margin-top:12px;padding:9px;background:#081725;border:1px solid var(--line);border-radius:12px}.map{position:relative;height:350px;background:#091827;border:1px solid var(--line);border-radius:14px}.map:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#ffffff22}.map:after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:#ffffff22}.dot{position:absolute;transform:translate(-50%,50%);width:20px;height:20px;border-radius:50%;background:var(--gold);border:3px solid white}.dot span{position:absolute;top:18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;background:#07111fd9;padding:2px 5px}.warn,.ok{padding:9px;border-radius:10px;margin:7px 0}.warn{background:#3b3018;border:1px solid #a87b29}.ok{background:#0d3325;border:1px solid #278b61}.modal{display:none;position:fixed;inset:0;z-index:10000;background:#000d}.modal.open{display:block}.modalbox{position:absolute;inset:0;background:var(--p);display:grid;grid-template-rows:auto minmax(0,1fr) auto}.mhead{display:flex;padding:calc(13px + env(safe-area-inset-top)) 15px 11px}.mhead h2{flex:1}.x{width:44px;height:44px;border:0;border-radius:50%;background:#213952;color:white;font-size:26px}.mscroll{overflow:auto;padding:14px}.mactions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:11px 15px calc(11px + env(safe-area-inset-bottom));border-top:2px solid var(--gold);background:#0b1d30}@media(max-width:850px){.half{grid-column:span 12}}@media(max-width:580px){.app{padding:8px 8px 90px}.brand{font-size:23px}.status{display:none}.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;background:#07111ff8;padding:7px 7px calc(7px + env(safe-area-inset-bottom))}.tab{flex:0 0 82px;white-space:normal;font-size:11px;min-height:56px}.forms{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.rule{grid-template-columns:1fr}.choice{flex-basis:78vw}}</style></head><body><div class="app"><div class="top"><div class="brand">🎳 Arsenal Bowling<span>by BonoRed's</span><small class="version">Version 15.4</small></div><div id="status" class="status">Prêt</div></div><nav class="tabs" id="tabs"></nav><main>
<section class="page active" data-page="choice"><div class="grid"><div class="card"><h2>🎯 Décision compétition</h2><div class="forms"><div><label>Piste</label><select id="qLane"><option value="pro" selected>Brunswick Pro Lane</option><option value="anvil">Brunswick Anvilane</option><option value="amf">AMF</option></select></div><div><label>Longueur</label><select id="qLength"><option value="treslong">Très long</option><option value="long">Long</option><option value="moyen" selected>Moyen</option><option value="court">Court</option></select></div><div><label>Volume</label><select id="qVolume"><option value="treshuile">Très huilé</option><option value="huile" selected>Huilé</option><option value="faible">Faiblement huilé</option><option value="sec">Sec</option></select></div><div><label>État</label><select id="qState"><option value="frais" selected>Frais</option><option value="transition">Transition</option><option value="brule">Brûlé</option></select></div></div><button class="btn gold" onclick="recommend()">Trouver ma boule</button></div><div class="card" id="recommendations"></div></div></section>

<section class="page" data-page="arsenal"><div class="grid"><div class="card"><h2>🎳 Arsenal <button class="btn gold" style="float:right" onclick="openBall()">+ Boule</button></h2><input id="search" placeholder="Rechercher" oninput="renderBalls()"></div><div class="card"><div class="balls" id="balls"></div></div></div></section>
<section class="page" data-page="games"><div class="grid"><div class="card half"><h2>📝 Enregistrer une partie</h2><div class="forms" id="gameForm"></div><div class="savezone"><button class="btn green" onclick="saveGame()">✓ Enregistrer la partie</button><div id="feedback" class="feedback"></div></div></div><div class="card half"><h2>Parties</h2><button class="btn red" onclick="deleteSelected()">Supprimer la sélection</button><div class="scroll"><table><thead><tr><th>Choisir</th><th>Date</th><th>Boule</th><th>Score</th><th>Condition</th></tr></thead><tbody id="games"></tbody></table></div></div></div></section>

<section class="page" data-page="builder"><div class="grid"><div class="card"><h2>🛠 Builder</h2><div id="builderKpis" class="kpis"></div></div><div class="card half"><h3>Manques</h3><div id="gaps"></div></div><div class="card half"><h3>Proximités</h3><div id="dups"></div></div><div class="card"><h3>Carte</h3><div id="map" class="map"></div></div></div></section>
<section class="page" data-page="backup"><div class="card"><h2>💾 Sauvegarde</h2><button class="btn gold" onclick="exportData()">Exporter JSON</button><label class="btn ghost">Importer JSON<input hidden type="file" onchange="importData(this.files[0])"></label></div></section></main></div>
<div class="modal" id="modal"><div class="modalbox"><div class="mhead"><h2 id="modalTitle">Nouvelle boule</h2><button class="x" onclick="closeBall()">×</button></div><div class="mscroll"><div id="ballForm" class="forms"></div></div><div class="mactions"><button class="btn green" onclick="saveBall()">Enregistrer</button><button class="btn ghost" onclick="closeBall()">Annuler</button></div></div></div><script>
'use strict';const KEY='arsenalBowlingV156';let db={balls:[],games:[],player:{speed:21,rpm:380,rotation:60,release:'normal',papH:4.5,papV:.5},updatedAt:null},edit=null;const $=x=>document.getElementById(x),n=x=>Number(x)||0,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tabs=[['choice','🎯 Choix'],['player','👤 Joueur'],['arsenal','🎳 Arsenal'],['games','📝 Parties'],['stats','📈 Stats'],['builder','🛠 Builder'],['backup','💾 Sauvegarde']];
function sel(id,l,a){return `<div><label>${l}</label><select id="${id}">${a.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div>`}function build(){tabs.forEach((t,i)=>$('tabs').insertAdjacentHTML('beforeend',`<button class="tab ${i?'':'active'}" onclick="show('${t[0]}',this)">${t[1]}</button>`));$('ballForm').innerHTML=`<div><label>Marque</label><input id="bBrand"></div><div><label>Modèle</label><input id="bModel"></div>${sel('bCover','Type',[['pearl','Pearl'],['hybrid','Hybrid'],['solid','Solid'],['urethane','Uréthane'],['polyester','Polyester']])}${sel('bCore','Noyau',[['sym','Symétrique'],['asym','Asymétrique']])}<div><label>Puissance de coverstock observée (1-10)</label><input id="bHook" type="number" min="1" max="10" value="6"></div>${sel('bSurface','Surface',[['polish','Polish'],['4000','4000'],['3000','3000'],['2000','2000'],['1500','1500'],['1000','1000'],['500','500']])}${sel('bLayout','Layout',[['control','Contrôle'],['benchmark','Benchmark'],['strong','Fort'],['skidflip','Skid-flip'],['custom','Personnalisé']])}<div><label>Pin-to-PAP</label><input id="bPin" type="number" value="4.5" step=".125"></div><div><label>VAL °</label><input id="bVal" type="number" value="45"></div><div><label>RG</label><input id="bRG" type="number" value="2.52" step=".001"></div><div><label>Différentiel</label><input id="bDiff" type="number" value=".04" step=".001"></div><div class="full"><label>Commentaires</label><textarea id="bNotes"></textarea></div>`;$('gameForm').innerHTML=`<div><label>Date</label><input id="gDate" type="date"></div><div><label>Centre</label><input id="gCenter" value="Buxerolles"></div><div><label>Boule</label><select id="gBall"></select></div><div><label>Score</label><input id="gScore" type="number"></div>${sel('gLane','Piste',[['pro','Pro Lane'],['anvil','Anvilane'],['amf','AMF']])}${sel('gLength','Longueur',[['treslong','Très long'],['long','Long'],['moyen','Moyen'],['court','Court']])}${sel('gVolume','Volume',[['treshuile','Très huilé'],['huile','Huilé'],['faible','Faible'],['sec','Sec']])}${sel('gState','État',[['frais','Frais'],['transition','Transition'],['brule','Brûlé']])}`;$('gDate').value=new Date().toISOString().slice(0,10);$('gLength').value='moyen';$('gVolume').value='huile'}function show(p,b){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
const surf={polish:12,'4000':28,'3000':43,'2000':60,'1500':70,'1000':82,'500':96},type={polyester:3,urethane:28,pearl:52,hybrid:74,solid:94},lay={control:30,benchmark:50,strong:82,skidflip:62,custom:50};function profile(b){const rg=clamp((2.62-n(b.rg||2.52))/.18*100,0,100),fl=clamp(n(b.diff||.04)/.06*100,0,100),core=b.core==='asym'?88:58,power=clamp(Math.round(n(b.hook||6)*10*.40+(surf[b.surface]||43)*.22+(type[b.cover]||60)*.15+core*.11+(lay[b.layout]||50)*.05+fl*.04+rg*.03),0,100),early=clamp(Math.round(rg*.35+(surf[b.surface]||43)*.35+(b.layout==='strong'?75:b.layout==='skidflip'?30:50)*.3),0,100),shape=clamp(Math.round((b.layout==='skidflip'?85:b.layout==='control'?25:50)*.6+(100-(surf[b.surface]||43))*.2+(b.core==='asym'?75:45)*.2),0,100);return{power,early,shape,flare:fl}}function need(){const p=db.player,mph=p.speed/1.60934,ratio=p.rpm/mph,adj=clamp((22.5-ratio)*.9,-15,15);return clamp(Math.round(50+({treshuile:25,huile:10,faible:-10,sec:-25}[$('qVolume').value]||0)+({court:-14,moyen:0,long:12,treslong:22}[$('qLength').value]||0)+({pro:8,anvil:0,amf:-6}[$('qLane').value]||0)+({frais:8,transition:-4,brule:-20}[$('qState').value]||0)+adj),0,100)}function recommend(){if(!db.balls.length)return $('recommendations').innerHTML='<p>Ajoutez une boule.</p>';const t=need(),a=db.balls.map(b=>({b,p:profile(b)})).sort((x,y)=>x.p.power-y.p.power),best=[...a].sort((x,y)=>Math.abs(x.p.power-t)-Math.abs(y.p.power-t))[0];$('recommendations').innerHTML=`<h2>Besoin personnalisé ${t}/100</h2><div id="choices" class="choices">${a.map(x=>`<div class="choice ${x===best?'best':''}" data-best="${x===best}"><h3>${esc(x.b.model)}</h3><b>BSI ${x.p.power}</b>${x===best?'<div class="score">Meilleur choix</div>':''}</div>`).join('')}</div><div class="rule"><div>Roule trop tôt : à gauche</div><div>Glisse trop : à droite</div></div>`;requestAnimationFrame(()=>{const f=$('choices'),c=f.querySelector('[data-best=true]');f.scrollLeft=c.offsetLeft-(f.clientWidth-c.offsetWidth)/2})}
function openBall(id){edit=id||null;const b=db.balls.find(x=>x.id===id)||{},m={bBrand:'brand',bModel:'model',bCover:'cover',bCore:'core',bHook:'hook',bSurface:'surface',bLayout:'layout',bPin:'pin',bVal:'val',bRG:'rg',bDiff:'diff',bNotes:'notes'},d={cover:'hybrid',core:'sym',hook:6,surface:'3000',layout:'benchmark',pin:4.5,val:45,rg:2.52,diff:.04};Object.entries(m).forEach(([e,k])=>$(e).value=b[k]??d[k]??'');$('modal').classList.add('open')}function closeBall(){$('modal').classList.remove('open')}async function saveBall(){if(!$('bBrand').value||!$('bModel').value)return alert('Marque et modèle requis');const b={id:edit||uid(),brand:$('bBrand').value,model:$('bModel').value,cover:$('bCover').value,core:$('bCore').value,hook:clamp(n($('bHook').value),1,10),surface:$('bSurface').value,layout:$('bLayout').value,pin:n($('bPin').value),val:n($('bVal').value),rg:n($('bRG').value),diff:n($('bDiff').value),notes:$('bNotes').value};db.balls=edit?db.balls.map(x=>x.id===edit?b:x):[...db.balls,b];save();closeBall()}function renderBalls(){const q=$('search').value.toLowerCase();$('balls').innerHTML=db.balls.filter(b=>(b.brand+' '+b.model).toLowerCase().includes(q)).map(b=>{const p=profile(b);return `<div class="ball"><h3>${esc(b.brand)} ${esc(b.model)}</h3><span class="tag">BSI ${p.power}</span><span class="tag">Lecture ${p.early}</span><span class="tag">Forme ${p.shape}</span><p class="muted">${esc(b.notes)}</p><button class="btn ghost" onclick="openBall('${b.id}')">Modifier</button><button class="btn red" onclick="deleteBall('${b.id}')">Supprimer</button></div>`}).join('')||'<p>Aucune boule</p>'}function deleteBall(id){if(confirm('Supprimer ?')){db.balls=db.balls.filter(x=>x.id!==id);save()}}
function savePlayer(){db.player={speed:n($('pSpeed').value),rpm:n($('pRpm').value),rotation:n($('pRot').value),release:$('pRelease').value,papH:n($('pPapH').value),papV:n($('pPapV').value)};save();renderPlayer()}function renderPlayer(){const p=db.player,mph=p.speed/1.60934,ratio=p.rpm/mph;$('pSpeed').value=p.speed;$('pRpm').value=p.rpm;$('pRot').value=p.rotation;$('pRelease').value=p.release;$('pPapH').value=p.papH;$('pPapV').value=p.papV;$('playerInfo').innerHTML=`<h3>Ratio ${ratio.toFixed(1)} RPM/mph</h3><p>${p.speed} km/h • ${p.rpm} RPM • ${p.rotation}° • ${p.release}</p>`}
function saveGame(){const score=n($('gScore').value),ballId=$('gBall').value;if(!ballId||score<0||score>300)return alert('Données invalides');db.games.push({id:uid(),date:$('gDate').value,center:$('gCenter').value,ballId,score,lane:$('gLane').value,length:$('gLength').value,volume:$('gVolume').value,state:$('gState').value});save();$('feedback').className='feedback ok';$('feedback').textContent='Partie enregistrée';$('gScore').value=''}function deleteSelected(){const ids=[...document.querySelectorAll('.gcheck:checked')].map(x=>x.value);if(ids.length&&confirm('Supprimer la sélection ?')){db.games=db.games.filter(x=>!ids.includes(x.id));save()}}function renderGames(){$('gBall').innerHTML='<option value="">Sélectionner</option>'+db.balls.map(b=>`<option value="${b.id}">${esc(b.model)}</option>`).join('');$('games').innerHTML=[...db.games].reverse().map(g=>`<tr><td><input class="gcheck" type="checkbox" value="${g.id}"></td><td>${g.date}</td><td>${esc(db.balls.find(b=>b.id===g.ballId)?.model||'Supprimée')}</td><td>${g.score}</td><td>${g.lane}/${g.length}/${g.state}</td></tr>`).join('')||'<tr><td colspan="5">Aucune partie</td></tr>'}function avg(a){return a.length?a.reduce((s,x)=>s+n(x.score),0)/a.length:0}function renderStats(){const scores=db.games.map(x=>x.score);$('kpis').innerHTML=[['Moyenne',avg(db.games).toFixed(1)],['Max',scores.length?Math.max(...scores):0],['Min',scores.length?Math.min(...scores):0],['Parties',scores.length]].map(x=>`<div class="kpi">${x[0]}<b>${x[1]}</b></div>`).join('');$('stats').innerHTML=db.balls.map(b=>{const g=db.games.filter(x=>x.ballId===b.id);return `<div class="mini"><h3>${esc(b.model)}</h3><b>${g.length?avg(g).toFixed(1):'-'}</b> (${g.length})</div>`}).join('')}
function similarity(a,b){const x=profile(a),y=profile(b);let s=100-Math.abs(x.power-y.power)*.8-Math.abs(x.early-y.early)*.45-Math.abs(x.shape-y.shape)*.35;if(a.cover!==b.cover)s-=14;if(a.core!==b.core)s-=12;if(a.layout!==b.layout)s-=8;return clamp(Math.round(s),0,100)}function renderBuilder(){const gaps=[];if(!db.balls.some(b=>profile(b).power<35))gaps.push('Pas de boule faible');if(!db.balls.some(b=>profile(b).power>75))gaps.push('Pas de boule forte');const pairs=[];for(let i=0;i<db.balls.length;i++)for(let j=i+1;j<db.balls.length;j++){const s=similarity(db.balls[i],db.balls[j]);if(s>=80)pairs.push(`${db.balls[i].model}/${db.balls[j].model}: ${s}%`)}$('builderKpis').innerHTML=[['Boules',db.balls.length],['Manques',gaps.length],['Proximités',pairs.length],['Layouts',new Set(db.balls.map(b=>b.layout)).size]].map(x=>`<div class="kpi">${x[0]}<b>${x[1]}</b></div>`).join('');$('gaps').innerHTML=gaps.map(x=>`<div class="warn">${x}</div>`).join('')||'<div class="ok">Complet</div>';$('dups').innerHTML=pairs.map(x=>`<div class="warn">${x}</div>`).join('')||'<div class="ok">Aucun</div>';const m=$('map');m.innerHTML='';db.balls.forEach(b=>{const p=profile(b),e=document.createElement('div');e.className='dot';e.style.left=(100-p.early)+'%';e.style.bottom=p.power+'%';e.innerHTML=`<span>${esc(b.model)}</span>`;m.appendChild(e)})}
function save(){db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db));renderAll();$('status').textContent='Sauvegardé '+new Date().toLocaleTimeString()}function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.balls)){db=x}}catch{}renderPlayer()}function renderAll(){renderBalls();renderGames();renderStats();renderBuilder()}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='Sauvegarde_Arsenal_Bowling.json';a.click()}function importData(f){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.balls))throw 0;db=x;save()}catch{alert('Fichier invalide')}};r.readAsText(f)}build();load();renderAll();
